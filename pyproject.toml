[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcoop"
version = "0.1.0"
description = "Multi-agent campus network fault diagnosis over a versioned, validated protocol"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "rfc3339-validator>=0.1.4",  # makes jsonschema check format: date-time
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netcoop = "netcoop.cli:main"

[tool.setuptools.packages.find]
include = ["netcoop*", "connectivity_service*"]

[tool.setuptools.package-data]
netcoop = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
